<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFC83D">
<meta name="apple-mobile-web-app-title" content="Southie's HQ">
<meta name="application-name" content="Southie's HQ">
<meta name="description" content="Southie's Studio team HQ: tasks, deadlines and the team in one place.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Southie's HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Southie's HQ — one committed look: neobrutalist blocks in Southie's ember, on warm paper */
:root{
  color-scheme:light;
  --paper:#FFF4EA; --card:#FFFFFF; --ink:#1B0D10; --ink-2:#4A3A3D; --ink-3:#8A7A7C; --dot:#E9D6C6;
  --ember:#FF5A36; --sun:#FFC83D; --pink:#FF9EC4; --lilac:#A98BFF; --mint:#93E6A8; --sky:#86D4F5; --oxblood:#491B22; --cream:#FFE9D6;
  --p1:#FF5A36; --p2:#FFC83D; --p3:#86D4F5; --p4:#D8CCC6;
  --b:2.5px solid var(--ink); --sh:4px 4px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink); --r:20px;
  --display:"Unbounded","Plus Jakarta Sans",system-ui,sans-serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--paper);touch-action:manipulation;overscroll-behavior:none;min-height:100%}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:12px 150px;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:20px 20px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.nb{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh)}
.press{transition:transform .08s ease,box-shadow .08s ease}
.press:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)!important}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:var(--sun);background-image:radial-gradient(rgba(27,13,16,.16) 1.4px,transparent 1.5px);background-size:22px 22px;transition:opacity .35s ease,visibility .35s}
#splash.gone{opacity:0;visibility:hidden}
.bigmark{width:110px;height:200px;overflow:visible}
.bigmark .blk{fill:var(--ember);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.splash-word{width:220px;aspect-ratio:559/53;background:var(--ink);-webkit-mask:url(wordmark.png) no-repeat center/contain;mask:url(wordmark.png) no-repeat center/contain}
.splash-tag{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.28em;background:var(--ink);color:var(--sun);padding:6px 12px;border-radius:99px}
.loadbar{width:min(260px,70vw);height:22px;border:var(--b);border-radius:99px;background:var(--card);box-shadow:var(--sh-sm);overflow:hidden}
.loadbar i{display:block;height:100%;width:8%;background:repeating-linear-gradient(-45deg,var(--ember) 0 10px,#FF7B5C 10px 20px);border-right:var(--b);transition:width .5s ease}
.loadmsg{font-weight:700;font-size:14px;min-height:20px}
@media (prefers-reduced-motion:no-preference){
  .bigmark .blk{animation:drop .55s cubic-bezier(.3,1.6,.5,1) both}
  .bigmark .b2{animation-delay:.15s}.bigmark .b3{animation-delay:.3s}.bigmark .b4{animation-delay:.45s}
  @keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.hello h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,5.4vw,26px);margin:0;line-height:1.1;letter-spacing:-.01em}
.hello .date{font-size:13px;color:var(--ink-2);font-weight:600}
.circ{width:46px;height:46px;flex:none;border-radius:50%;border:var(--b);box-shadow:var(--sh-sm);display:grid;place-items:center;background:var(--card);padding:0}
.circ svg.ic{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.circ.c-ember{background:var(--ember)} .circ.c-sun{background:var(--sun)} .circ.c-pink{background:var(--pink)} .circ.c-lilac{background:var(--lilac)} .circ.c-mint{background:var(--mint)} .circ.c-sky{background:var(--sky)}
.circ .buddy{width:38px;height:auto;margin-top:4px}
.pagehead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.pagehead h2{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,21px);margin:0;text-align:center;letter-spacing:-.01em}
.minilock{display:flex;align-items:center;gap:8px}
.minilock .mk{width:14px;height:25px;fill:var(--ink)}
.minilock .wm{height:10px;aspect-ratio:559/53;background:var(--ink);-webkit-mask:url(wordmark.png) no-repeat left center/contain;mask:url(wordmark.png) no-repeat left center/contain}

/* type */
.big{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.sub{color:var(--ink-2);margin:6px 0 0;font-weight:500}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect h3{font-family:var(--display);font-weight:700;font-size:15px;margin:0}
.sect .lnk{background:none;border:0;padding:0;font-weight:700;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* hero next-up */
.hero{padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .buddy{position:absolute;right:-6px;bottom:-12px;width:108px;height:auto;transform:rotate(-8deg)}
.nextup{font-weight:700;font-size:16px;max-width:calc(100% - 96px);overflow-wrap:anywhere}
.count{display:flex;align-items:flex-start;gap:6px}
.count .u{display:flex;flex-direction:column;align-items:center;gap:4px}
.count .bx{min-width:58px;padding:8px 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;background:var(--card);border:var(--b);border-radius:12px;box-shadow:var(--sh-sm);font-variant-numeric:tabular-nums}
.count .u span{font-size:11px;font-weight:700}
.count .colon{font-family:var(--display);font-weight:800;font-size:22px;padding-top:10px;color:var(--ink)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:flex-start;padding:11px 18px;border:var(--b);border-radius:14px;box-shadow:var(--sh-sm);background:var(--sun);font-weight:800;font-size:14.5px}
.cta.dark{background:var(--ink);color:var(--card)}
.cta.white{background:var(--card)}

/* week strip */
.week{padding:12px 10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wday{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px}
.wday .wd{font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.06em}
.wday .dn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;border:2.5px solid transparent}
.wday.today .dn{background:var(--ember);color:var(--card);border-color:var(--ink)}
.wday[aria-pressed="true"] .dn{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.wday[aria-pressed="true"]:not(.today) .dn{background:var(--sun)}
.wday .pips{display:flex;gap:2px;height:6px}
.wday .pips i{width:6px;height:6px;border-radius:50%;background:var(--pc);border:1.5px solid var(--ink)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px 10px 12px;border-radius:22px;border:var(--b);box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card)}
.tile.dashed{border-style:dashed;box-shadow:none;background:transparent}
.tile .ico{width:36px;height:36px;border-radius:50%;border:var(--b);display:grid;place-items:center;margin-top:-30px;background:var(--card)}
.tile .ico svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.tile span{font-size:12px;font-weight:700;color:var(--ink-2)}
.tiles-wrap{padding-top:16px}

/* quick add */
.qa{display:flex;gap:10px;align-items:stretch}
.qa .field{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;min-height:54px;background:var(--card);border:var(--b);border-radius:16px;box-shadow:var(--sh-sm)}
.qa .field .hash{font-family:var(--display);font-weight:800;font-size:18px}
.qa input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-weight:600;font-size:15px;padding:12px 0}
.qa input::placeholder{color:var(--ink-3);font-weight:500}
.qa .lock{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.qa .lock svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.qa .lock[aria-pressed="true"]{background:var(--lilac)}
.qa .plus{width:56px;flex:none;border:var(--b);border-radius:16px;background:var(--sun);box-shadow:var(--sh-sm);display:grid;place-items:center;padding:0}
.qa .plus svg{width:24px;height:24px;stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.qa .plus:disabled{opacity:.5}
.qachips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
.qahint{font-size:12.5px;color:var(--ink-2);margin-top:-8px}
.qahint code{font-family:var(--mono);font-size:12px;background:var(--cream);border:1.5px solid var(--ink);border-radius:6px;padding:0 4px}

/* chips, pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;border:2px solid var(--ink);background:var(--card);white-space:nowrap}
.chip.k-p1{background:var(--p1);color:var(--card)} .chip.k-p2{background:var(--p2)} .chip.k-p3{background:var(--p3)} .chip.k-p4{background:var(--p4)}
.chip.k-doing{background:var(--sun)} .chip.k-waiting{background:var(--lilac)} .chip.k-private{background:var(--ink);color:var(--card)} .chip.k-done{background:var(--mint)}
.chip .buddy{width:18px;height:auto;margin:-3px 0 -3px -4px}
.due{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.due.overdue{background:var(--ember);color:var(--card);padding:1px 7px;border-radius:7px;border:2px solid var(--ink)}
.due.soon{background:var(--sun);padding:1px 7px;border-radius:7px;border:2px solid var(--ink)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px 2px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;border:var(--b);background:var(--card);font-weight:700;font-size:13.5px;white-space:nowrap}
.pill .buddy{width:22px;height:auto;margin:-6px 0 -6px -6px}
.pill[aria-pressed="true"]{background:var(--mint);box-shadow:var(--sh-sm)}
.seg{display:inline-flex;gap:6px;padding:5px;border-radius:99px;border:var(--b);background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:99px;font-weight:800;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}

/* task rows */
.group{display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:12.5px}
.ghead .n{font-family:var(--mono);font-size:12px;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 8px}
.ghead.hot{color:var(--ember)}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.task{position:relative;touch-action:pan-y}
.swipebg{position:absolute;inset:0;border-radius:18px;border:var(--b);background:var(--mint);display:flex;align-items:center;padding-left:18px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.12em;opacity:0}
.task.swiping .swipebg{opacity:1}
.task.done .swipebg{background:var(--sun)}
.slide{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 14px;background:var(--card);border:var(--b);border-radius:18px;box-shadow:var(--sh-sm);transform:translateX(var(--dx,0px));transition:transform .22s ease;cursor:pointer}
.task.swiping .slide{transition:none}
.task.armed .slide{background:var(--mint)}
.slide .stripe{position:absolute;left:-2.5px;top:14px;width:8px;height:22px;border:2px solid var(--ink);border-left:0;border-radius:0 6px 6px 0;background:var(--pc)}
.pr1{--pc:var(--p1)} .pr2{--pc:var(--p2)} .pr3{--pc:var(--p3)} .pr4{--pc:var(--p4)}
.tick{width:28px;height:28px;border-radius:9px;border:var(--b);background:var(--card);display:grid;place-items:center;padding:0;margin-left:6px}
.tick:hover{background:var(--cream)}
.done .tick{background:var(--mint)}
.done .tick::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{min-width:0;display:flex;flex-direction:column;gap:7px}
.ttitle{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.done .ttitle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-3)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.faces{display:flex}
.faces .face{margin-left:-10px}
.faces .face:first-child{margin-left:0}
.face{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--fc,var(--cream));display:grid;place-items:end center;overflow:hidden;flex:none;position:relative}
.face .buddy{width:30px;height:auto;margin-bottom:-4px}
.face.on::after{content:"";position:absolute;right:0;top:0;width:10px;height:10px;border-radius:50%;background:#2DBE5C;border:2px solid var(--ink)}
.empty{padding:26px 18px;text-align:center;border:2.5px dashed var(--ink);border-radius:20px;font-weight:600;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-weight:800;color:var(--ink);font-size:15px;margin-bottom:4px}
.tip{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center}

/* folder cards (projects, shortcuts) */
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}
.folder{position:relative;padding:14px;padding-top:16px;margin-top:12px;border:var(--b);border-radius:6px 18px 18px 18px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px;text-align:left;min-height:130px}
.folder::before{content:"";position:absolute;left:-2.5px;top:-14px;width:46%;height:14px;border:var(--b);border-bottom:0;border-radius:10px 14px 0 0;background:var(--fc)}
.folder .fi{width:46px;height:46px;border:var(--b);border-radius:12px;background:var(--fc);display:grid;place-items:center}
.folder .fi svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.folder .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.folder .fc{font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right}
.folder .fn{font-weight:800;font-size:15px;line-height:1.2}
.bar{height:12px;border:2px solid var(--ink);border-radius:99px;background:var(--cream);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fc,var(--mint));border-right:2px solid var(--ink)}
.badge-new{font-size:10px;font-weight:800;background:var(--ember);color:var(--card);padding:1px 6px;border-radius:6px;border:1.5px solid var(--ink)}

/* team + member pages */
.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:620px){.teamgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 14px;border:var(--b);border-radius:22px;background:var(--fc);box-shadow:var(--sh);text-align:center;overflow:hidden}
.mcard .buddy{width:84px;height:auto}
.mcard .mn{font-family:var(--display);font-weight:800;font-size:14px}
.mcard .mr{font-size:12px;font-weight:700;color:var(--ink-2)}
.mcard .mo{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
.mcard .ondot{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:1px 7px}
.mcard .ondot i{width:8px;height:8px;border-radius:50%;background:#2DBE5C}
.phero{position:relative;padding:18px;border:var(--b);border-radius:26px;background:var(--fc);box-shadow:var(--sh);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;overflow:hidden}
.phero .buddy{width:130px;height:auto;margin:-6px -8px -26px 0}
.phero .role{font-weight:700;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:3px 10px;margin-top:10px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.status.on i{background:#2DBE5C}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.areas{display:flex;flex-wrap:wrap;gap:8px}
.areas .chip{font-size:12.5px;padding:5px 11px}
@media (prefers-reduced-motion:no-preference){.wiggle{animation:wig .9s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:12px}
.lbrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:var(--b);border-radius:20px;box-shadow:var(--sh-sm);background:var(--card)}
.lbrow .rank{display:flex;align-items:center;gap:8px;padding:6px 12px;border:var(--b);border-radius:14px;background:var(--rc,var(--cream));font-family:var(--display);font-weight:800;font-size:18px}
.lbrow .who{display:flex;align-items:center;gap:10px;min-width:0}
.lbrow .who b{display:block;font-weight:800}
.lbrow .who span{font-size:12px;font-weight:600;color:var(--ink-2)}
.pct{width:56px;height:56px;border-radius:50%;border:var(--b);display:grid;place-items:center;background:conic-gradient(var(--ink) calc(var(--v)*1%),var(--cream) 0);position:relative}
.pct::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.pct b{position:relative;font-family:var(--display);font-weight:800;font-size:13px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:end;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .buddy{width:70px;height:auto}
.pod .blockp{width:100%;border:var(--b);border-radius:14px 14px 6px 6px;box-shadow:var(--sh-sm);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--rc)}
.pod .nm{font-weight:800;font-size:13px}

/* calendar */
.month{padding:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead b{font-family:var(--display);font-weight:800;font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mgrid .wl{font-size:10.5px;font-weight:800;color:var(--ink-3)}
.mday{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13.5px;padding:0}
.mday.out{color:var(--ink-3);font-weight:600}

@keyframes conf{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
.notice{padding:12px 14px;border:var(--b);border-radius:16px;background:var(--sun);font-weight:700;font-size:13.5px;box-shadow:var(--sh-sm)}
.skel{height:84px;border:2.5px dashed var(--ink-3);border-radius:20px}
@media (prefers-reduced-motion:reduce){.conf{display:none}.slide,.banner,.press,.col{transition:none}}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .24s cubic-bezier(.3,1.3,.5,1)}@keyframes rise{from{transform:translateY(40px)}to{transform:none}}.page-in{animation:pin .22s ease-out}@keyframes pin{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>

  return PROJ_STYLE[k] || {c:"#FFE9D6", i:"folder"};
}

/* ---------- dates (IST) ---------- */
const fDay = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const fTime = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true});
const fHM = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const fShort = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"});
const fDate = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,weekday:"short",day:"numeric",month:"long"});
const fMonth = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,month:"long",year:"numeric"});
const fWd = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,weekday:"short"});
const fDn = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,day:"numeric"});
const dayKey = ms => fDay.format(new Date(ms));
const dayStart = k => Date.parse(k + "T00:00:00+05:30");
const mid = k => dayStart(k) + 12 * 3600e3;
const addDays = (k, n) => dayKey(mid(k) + n * 864e5);
const todayK = () => dayKey(Date.now());
function dayLabel(ms){ const k = dayKey(ms), t = todayK(); if(k === t) return "Today"; if(k === addDays(t,1)) return "Tomorrow"; if(k === addDays(t,-1)) return "Yesterday"; return fShort.format(new Date(ms)); }
const dueText = t => t.dueAt ? dayLabel(t.dueAt) + " · " + fTime.format(new Date(t.dueAt)) : "No date";
function urgency(t){ if(t.status === "done" || !t.dueAt) return ""; const d = t.dueAt - Date.now(); return d < 0 ? "overdue" : d < 864e5 ? "soon" : ""; }
const toMs = (d, t) => d ? Date.parse(`${d}T${t || "18:00"}:00+05:30`) : null;
const toInputs = ms => ms ? {d: dayKey(ms), t: fHM.format(new Date(ms))} : {d:"", t:""};
const eod = () => Date.parse(todayK() + "T23:59:59+05:30");
function sortTasks(a, b){
  const da = a.status === "done", db2 = b.status === "done"; if(da !== db2) return da ? 1 : -1;
  const oa = urgency(a) === "overdue", ob = urgency(b) === "overdue"; if(oa !== ob) return oa ? -1 : 1;
  const pa = a.priority || 3, pb = b.priority || 3; if(pa !== pb) return pa - pb;
  return (a.dueAt || 9e15) - (b.dueAt || 9e15);
}
function weekOf(k){ const wd = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(fWd.format(new Date(mid(k)))); return Array.from({length:7}, (_, i) => addDays(k, i - wd)); }

/* ---------- quick-add parser ---------- */
const WD = ["sun","mon","tue","wed","thu","fri","sat"], MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseQuick(raw){
  let s = " " + raw + " "; const out = {assignees:[], priority:null, project:null, date:null, time:null};
  s = s.replace(/\s@([a-z][\w-]*)/gi, (m, n) => { const q = n.toLowerCase(); const hit = members().find(x => x.key === q || x.name.toLowerCase().startsWith(q)); if(hit){ if(!out.assignees.includes(hit.key)) out.assignees.push(hit.key); return " "; } return m; });
  s = s.replace(/\s!([1-4])(?=\s)/g, (m, n) => { out.priority = +n; return " "; });
  s = s.replace(/\s#([\w-]+)/g, (m, n) => { const q = n.toLowerCase(); const hit = projects().find(p => p.key === q || p.name.toLowerCase().replace(/[^a-z0-9]/g,"").startsWith(q)); if(hit){ out.project = hit.key; return " "; } return m; });
  const t = todayK();
  s = s.replace(/\s(today|tonight)(?=\s)/i, (m, w) => { out.date = t; if(/tonight/i.test(w)) out.time = out.time || "20:00"; return " "; });
  s = s.replace(/\s(tomorrow|tmrw|tmr)(?=\s)/i, () => { out.date = addDays(t,1); return " "; });
  s = s.replace(/\s(?:on\s|next\s)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|sday|urday)?(?=\s)/i, (m, w) => { const target = WD.indexOf(w.slice(0,3).toLowerCase()), cur = WD.indexOf(fWd.format(new Date()).slice(0,3).toLowerCase()); let d = (target - cur + 7) % 7; if(d === 0) d = 7; out.date = addDays(t, d); return " "; });
  s = s.replace(/\s(\d{1,2})\s?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*(?=\s)/i, (m, d, mo) => { out.date = mkDate(+d, MON.indexOf(mo.slice(0,3).toLowerCase())); return " "; });
  s = s.replace(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\s?(\d{1,2})(?=\s)/i, (m, mo, d) => { out.date = mkDate(+d, MON.indexOf(mo.slice(0,3).toLowerCase())); return " "; });
  s = s.replace(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i, (m, h, mi, ap) => { let H = +h % 12; if(ap.toLowerCase() === "pm") H += 12; out.time = String(H).padStart(2,"0") + ":" + (mi || "00"); return " "; });
  s = s.replace(/\s(?:at\s)([01]?\d|2[0-3]):([0-5]\d)(?=\s)/i, (m, h, mi) => { out.time = String(h).padStart(2,"0") + ":" + mi; return " "; });
  if(out.time && !out.date) out.date = t;
  out.title = s.replace(/\s+/g, " ").trim(); out.dueAt = out.date ? toMs(out.date, out.time) : null;
  return out;
}
function mkDate(d, m){ const y = +todayK().slice(0,4); let k = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayStart(k) < dayStart(todayK()) - 864e5) k = `${y+1}-${k.slice(5)}`; return k; }

/* ---------- data ---------- */
const refFor = t => t.list === "private" ? state.db.doc(`users/${state.uid}/tasks/${t.id}`) : state.db.doc(`tasks/${t.id}`);
function findTask(key){ const [l, id] = key.split(":"); return (l === "private" ? state.priv : state.tasks).find(t => t.id === id) || null; }
const tasksFor = k => state.tasks.filter(t => (t.assignees || []).includes(k));
const myTasks = () => (state.meKey ? tasksFor(state.meKey) : []).concat(state.priv);
function writeError(e){
  const c = e && e.code;
  if(c === "permission-denied"){ toast("HQ didn't allow that. Check you're signed in with your team email."); return; }
  if(c === "resource-exhausted"){ toast("HQ is busy right now. Try again in a minute."); return; }
  toast("Couldn't save that. Check your connection and try again.");
}
function relayCall(action, extra){
  return new Promise((resolve, reject) => {
    (async () => {
      try{
        const nonce = Math.random().toString(36).slice(2) + Date.now();
        await state.db.doc(`relay/${state.uid}`).set({email: state.email, action, nonce, ts: Date.now(), ...extra});
        const res = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({uid: state.uid, nonce})});
        const data = await res.json();
        if(data.error) reject(new Error(data.error)); else resolve(data);
      }catch(e){ reject(e); }
    })();
  });
}

/* ---------- shared pieces ---------- */
function metaChips(t){
  const p = project(t.project); let h = `<span class="due ${urgency(t)}">${esc(dueText(t))}</span>`;
  if(t.status === "doing" || t.status === "waiting") h += `<span class="chip k-${t.status}">${STATUS[t.status]}</span>`;
  if(p) h += `<span>${esc(p.name)}</span>`;
  if(t.list === "private") h += `<span class="chip k-private">Private</span>`;
  if(t.lastCommentAt) h += `<span class="chip">Comments</span>`;
  return h;
}
function row(t, showFaces = true){
  const key = `${t.list}:${t.id}`, pr = t.priority || 3;
  const as = t.list === "private" || !showFaces ? [] : (t.assignees || []).filter(member);
  return `<li class="task ${t.status === "done" ? "done" : ""}" data-open="${key}"><div class="swipebg">${t.status === "done" ? "UNDO" : "DONE!"}</div>
    <div class="slide pr${pr}"><span class="stripe"></span>

      <div class="faces">${as.slice(0,3).map(k => face(k)).join("")}</div></div></li>`;
}
const list = (items, empty, showFaces) => items.length ? `<ul class="tasks">${items.map(t => row(t, showFaces)).join("")}</ul>` : empty;
const group = (title, items, cls, showFaces) => items.length ? `<section class="group"><div class="ghead ${cls || ""}"><span>${esc(title)}</span><span class="n">${items.length}</span></div>${list(items, "", showFaces)}</section>` : "";
const emptyBox = (h, p) => `<div class="empty"><b>${esc(h)}</b>${esc(p)}</div>`;
const backBtn = (color = "c-sun") => `<button type="button" class="circ ${color} press" data-back="1" aria-label="Back">${ic("back")}</button>`;
function pageHead(title, color, right){ return `<div class="pagehead">${state.stack.length > 1 ? backBtn(color) : `<div class="minilock">${ic("mark","mk")}<div class="wm"></div></div>`}<h2>${esc(title)}</h2>${right || `<button type="button" class="circ c-pink press" data-go="search" aria-label="Search">${ic("search")}</button>`}</div>`; }
function qaBlock(ctx){

      ${folderBtn("me", "Settings & help", "#86D4F5", "gear", "Quick-add tips", "")}

function folderBtn(go, name, color, icon, count, param){
  const dark = color === "#1B0D10";
  return `<button type="button" class="folder press" style="--fc:${color}" data-go="${go}" ${param ? `data-param="${esc(param)}"` : ""}><div class="fh"><span class="fi" ${dark ? 'style="background:#1B0D10"' : ""}>${dark ? ic(icon,"").replace('class=""','style="stroke:#fff"') : ic(icon,"")}</span><span class="fc">${esc(count)}</span></div><span class="fn">${esc(name)}</span></button>`;
}
function cdHtml(due){
  let d = Math.max(0, due - Date.now()); const D = Math.floor(d / 864e5); d -= D * 864e5; const H = Math.floor(d / 36e5); d -= H * 36e5; const M = Math.floor(d / 6e4);
  const u = (v, l) => `<div class="u"><div class="bx">${String(v).padStart(2,"0")}</div><span>${l}</span></div>`;
  return u(D,"Days") + `<div class="colon">:</div>` + u(H,"Hours") + `<div class="colon">:</div>` + u(M,"Minutes");
}
function filtered(){ let items = state.tasks.slice(); if(state.people.size) items = items.filter(t => (t.assignees || []).some(a => state.people.has(a))); return items; }

    <button type="button" class="cta white press" data-signin="1" style="font-size:16px;padding:14px 20px"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
    <div class="tip" style="text-align:left">Not on the team list yet? Ask Richard to add your email in Team, then Add a teammate.</div></div>`;
}
function pageNotTeam(){
  return `<div class="whopage page-in"><div class="minilock">${ic("mark","mk")}<div class="wm"></div></div>
    <div class="modalish nb" style="padding:22px;background:var(--pink)"><div class="eyebrow">Almost there</div><h1 class="big" style="margin-top:8px;font-size:28px">You're not on<br>the team list yet.</h1><p class="sub">You signed in as <b>${esc(state.email)}</b>. Ask Richard to add this email under Team, then Add a teammate, then come back.</p></div>
    <div class="actions"><button type="button" class="cta press" data-signout="1">Use a different account</button></div></div>`;
}
async function boot(){
  progress(20);
  if(!FIREBASE_CONFIG || !window.firebase){ state.noHost = true; state.ready = true; render(true); hideSplash(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore(); state.db = db;
  initPushForeground();
  try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  try{ await firebase.auth().getRedirectResult(); }catch(e){ if(e && e.code) toast("Sign-in didn't finish. Try again."); }
  progress(45);
  let unsubs = [];
  firebase.auth().onAuthStateChanged(user => {
    unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
    state.team = null; state.tasks = []; state.priv = []; state.privMe = null; state.meKey = null; state.denied = false;
    if(!user){ state.signedOut = true; state.uid = null; state.email = ""; state.ready = true; render(true); hideSplash(); return; }
    state.signedOut = false; state.uid = user.uid; state.email = (user.email || "").toLowerCase(); state.canWrite = true; state.canWriteChecked = true;
    progress(70);
    const denied = e => { if(e && e.code === "permission-denied"){ state.denied = true; state.ready = true; render(true); hideSplash(); } else toast("Lost connection to HQ. Check your internet."); };
    let gotTeam = false, gotTasks = false; const maybeDone = () => { if(gotTeam && gotTasks){ state.ready = true; progress(92); hideSplash(); render(); } };
    unsubs.push(db.doc("config/team").onSnapshot(s => { state.team = s.exists ? s.data() : null; resolveMe(); gotTeam = true; if(!state.team && OWNERS.includes(state.email)){ state.needsSetup = true; } announce(); render(); maybeDone(); }, denied));
    unsubs.push(db.collection("tasks").onSnapshot(s => { state.tasks = s.docs.map(d => ({...d.data(), id:d.id, list:"team"})); gotTasks = true; render(); maybeDone(); if(state.sheet && !state.sheet.isNew && !findTask(state.sheet.key)){ closeSheet(); toast("That task was deleted by someone else."); } }, denied));
    unsubs.push(db.collection("files").onSnapshot(s => { state.files = s.docs.map(d => ({...d.data(), id:d.id})); render(); }, () => {}));
    claimPending(db);
    const pd = db.doc(`users/${state.uid}`);
    unsubs.push(pd.onSnapshot(s => { state.privMe = s.exists ? s.data() : null; resolveMe(); announce(); render(); }, () => {}));
    unsubs.push(pd.collection("tasks").onSnapshot(s => { state.priv = s.docs.map(d => ({...d.data(), id:d.id, list:"private"})); render(); }, () => {}));
    unsubs.push(db.collection("presence").onSnapshot(s => { state.presence = s.docs.map(d => ({id:d.id, ...d.data()})); computeOnline(); }, () => {}));
    const since = Date.now() - 5000;
    unsubs.push(db.collection("events").where("ms", ">", since).onSnapshot(s => {
      s.docChanges().forEach(ch => {
        if(ch.type !== "added") return; const d = ch.doc.data() || {};
        if(d.uid === state.uid) return;
        if(d.type === "done" && typeof d.m === "string" && member(d.m)) showBanner(d.m, `<b>${esc(first(member(d.m)))}</b> just finished “${esc(String(d.title || "a task").slice(0,120))}”`, bstyle(d.m).c);
        if(d.type === "nudge" && d.to === state.meKey && member(d.from)) showNudge(d.from);
      });
    }, () => {}));
  });
}
async function claimPending(db){
  try{
    const ref = db.doc(`pending/${state.email}`); const snap = await ref.get();
    if(!snap.exists) return;
    const d = snap.data() || {};
    for(const t of (d.privateTasks || [])){ const {id, ...rest} = t; await db.doc(`users/${state.uid}/tasks/${id || db.collection("x").doc().id}`).set(rest); }
    await ref.delete();
    if((d.privateTasks || []).length) toast(`Moved ${(d.privateTasks || []).length} tasks into your private list`);
  }catch(e){}
}
window.hqAdmin = {
  async importData(data){
    if(!state.db || !OWNERS.includes(state.email)) throw new Error("Sign in as an owner first");
    const db = state.db, out = {team:0, tasks:0, comments:0, priv:0};
    if(data.team){ const t = {...data.team}; t.emails = (t.members || []).map(m => (m.email || "").toLowerCase()).filter(Boolean); await db.doc("config/team").set(t); out.team = 1; }
    for(const t of (data.tasks || [])){ const {id, comments, ...rest} = t; await db.doc(`tasks/${id}`).set(rest); out.tasks++; for(const c of (comments || [])){ const {id: cid, ...cr} = c; await db.doc(`tasks/${id}/comments/${cid}`).set(cr); out.comments++; } }
    if(data.me){ await db.doc(`users/${state.uid}`).set(data.me); }
    for(const t of (data.privateTasks || [])){ const {id, ...rest} = t; await db.doc(`users/${state.uid}/tasks/${id}`).set(rest); out.priv++; }
    return out;
  }
};
render(true); boot();
</script>
