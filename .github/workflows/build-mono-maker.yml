name: Build Mono Maker

on:
  push:
    branches: [mono-maker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build the app
        run: |
          mkdir -p dist
          bash build.command 2>&1 | tee dist/build-log.txt
          test -x "Mono Maker.app/Contents/MacOS/MonoMaker"

      - name: Smoke test (app launches and stays up)
        run: |
          "Mono Maker.app/Contents/MacOS/MonoMaker" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "App exited early"; exit 1; fi

      - name: Conversion tests
        id: tests
        continue-on-error: true
        run: |
          brew install ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python3 -m pip install --quiet --break-system-packages numpy 2>/dev/null || python3 -m pip install --quiet numpy
          set -o pipefail
          { sw_vers; bash tests/make_media.sh; bash tests/run_tests.sh; } 2>&1 | tee dist/test-log.txt

      - name: Save the built app and logs to the branch
        if: always()
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Mono Maker.app" dist/Mono-Maker.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "Built Mono Maker.app (tests: ${{ steps.tests.outcome }}) [skip ci]"
          git push

      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
